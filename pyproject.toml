[project]
name = "credit-risk-modeling-pipeline"
version = "0.1.0"
description = "신용 위험 분류·회귀 실험과 검증 기반 모델 선택을 재현하는 머신러닝 파이프라인"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff>=0.11,<1",
]

[tool.uv]
constraint-dependencies = [
    "pyparsing==3.1.4",
    "scipy==1.14.1",
]

[project.scripts]
credit-risk = "credit_risk.cli:main"
credit-risk-generate-data = "credit_risk.generate_data:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
markers = ["smoke: 외부 서비스·원본 데이터 변경 없이 주요 실행 경로 검증"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
