[project]
name = "credit-risk-modeling-pipeline"
version = "0.1.0"
description = "Reproducible credit risk classification and regression pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_risk"]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
constraint-dependencies = [
    "pyparsing==3.1.4",
    "scipy==1.14.1",
]
